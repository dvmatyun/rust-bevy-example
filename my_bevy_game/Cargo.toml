[package]
name = "my_bevy_game"
version = "0.1.0"
edition = "2024"

[lib]
name = "my_bevy_game"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "my_bevy_game_bin"
path = "src/main.rs"

[dependencies.bevy]
path = "C:/Repositories/Rust/bevy"
default-features = false
features = [
  "android-native-activity",
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_image",
  "bevy_light",
  "bevy_log",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_render",
  "bevy_shader",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "hdr",
  "ktx2",
  "multi_threaded",
  "png",
  "tonemapping_luts",
  "touch",
  "webgl2",
  "zstd_rust",
]

[package.metadata.android]
package = "com.example.mybevygame"
label = "My Bevy Game"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33

[package.metadata.android.signing.release]
path = "C:/Users/worc1/.android/debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"
